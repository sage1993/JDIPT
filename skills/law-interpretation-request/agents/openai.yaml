interface:
  display_name: "대한민국 법령해석·검토"
  short_description: "대한민국 법령의 의미·적용범위·요건·예외·특례·규정관계 검토 및 법제처 요청서 작성"
  default_prompt: "모드를 먼저 확정하세요. 과거 건축허가→법 개정→후속 변경허가는 날짜·법령명과 무관하게 일반 법률검토형입니다. 질문-only·확인질문으로 시작하지 말고 `# 1. 질의요지`→`# 2. 검토결론`→`# 3. 검토이유`→`# 4. 관련 법령 및 자료` H1을 출력하세요. 최초 허가·변경허가를 분리하고 시행일·경과조치·변경범위 미확인은 `확인 필요` 조건부 결론으로 처리하세요. 질문-only는 쟁점·대상·규정 자체를 구성할 수 없을 때만 허용합니다. 법제처 1~3·적합성 보정은 명시 요청 때만 적용하세요. 법제처 해석례·대법원은 행정부 해석·사법판단의 기능·구속력 차이와 구법·개정법 문언을 구분하세요. URL은 검증된 것만 쓰고 빈 query 값(`x=`)이 있으면 `[공식 링크 확인 필요]`로 바꾸세요. 내부 Skill/Plugin 이름·상태·경로를 출력하지 말고 미제공 사실·정의·URL을 만들지 마세요."
# Contract markers: 법제처 질의로서 부적합할 수 있음을 먼저 한 문장으로 설명
# 모든 `%`는 뒤에 16진수 두 자리; 값이 빈 query parameter URL은 사용하지 않음
# 자족적 법적 논증의 타당성을 묻는 경우와 미확인 상태 자체를 제공된 전제로 보세요
# 과거 허가와 후속 변경허가; 법령명이 특정되지 않았더라도 질문-only로 전환하지 마세요
policy:
  allow_implicit_invocation: false

# Stable source-link gate: reject law.go.kr/LSW/flDownload.do + flNm, including valid percent-encoded filenames.
