interface:
  display_name: "대한민국 법령해석·검토"
  short_description: "대한민국 법령의 의미·적용범위·요건·예외·특례·규정관계 검토 및 법제처 요청서 작성"
  default_prompt: >
    대한민국 법령의 의미·적용범위를 검토한다.
    적용시점, 직접 근거, 예외·특례와 구체적 법적 효과를 확인하고,
    확인되지 않은 material proposition은 확정하지 않는다.
    일반 법률검토는 4-H1, 명시적 법제처 요청은 해당 전용 형식을 사용한다.
policy:
  allow_implicit_invocation: false

