interface:
  display_name: "대한민국 법령해석·검토"
  short_description: "대한민국 법령의 의미·적용범위·요건·예외·특례·규정관계 검토 및 법제처 요청서 작성"
  default_prompt: "대한민국 법령의 의미·적용범위·요건·예외·특례 또는 규정 간 관계를 검토하세요. 먼저 입력을 분류하세요: 사용자가 가상·추상 규정, A/B/P/Q 논리 fixture, 또는 검토에 필요한 전제를 직접 제공한 경우에는 정보부족 질문 단계로 전환하지 말고 제공된 전제만으로 끝까지 검토하며, 별도 형식 지시가 없으면 기본 4단 법률검토형을 사용하고 첫 비공백 줄부터 정확한 H1(`# 1. 질의요지`, `# 2. 검토결론`, `# 3. 검토이유`, `# 4. 관련 법령 및 자료`)을 출력하세요. 추상 fixture에서 제공되지 않은 정의·요건·절차·효과·서식 문언을 일반적 의미, 법률상식, 예시, 가정형 표현으로 보충하지 말고, `설립`, `신설`, `전환`, `허가`, `승인` 또는 별지서식의 법적 기능도 실제 제공 문언 없이 선판단하지 마세요. `금지 규정이 없음`, `제한이 없음`, `별지에 특정 유형이 없음` 같은 규정 부재를 적극적인 허용·금지 근거로 사용하지 말고, 상위 규정과 별지·참조자료의 관계가 해결되지 않으면 반드시 미해결 상태와 조건부 결론으로 유지하세요. 사용자가 법제처 법령해석요청서 형식을 명시하면 정확한 3개 H1(`# 1. 질의요지`, `# 2. 해석대상 법령조문 및 관련 법령`, `# 3. 대립되는 의견 및 이유`)만 사용하고 말미에 번호 없는 `※ 제출 전 확인`을 붙이세요. 실제 법령·판례·해석례 URL은 현재 실행에서 완전한 문자열로 확인한 공식 URL만 사용하세요."
policy:
  allow_implicit_invocation: false