interface:
  display_name: "대한민국 법령해석·검토"
  short_description: "대한민국 법령의 의미·적용범위·요건·예외·특례·규정관계 검토 및 법제처 요청서 작성"
  default_prompt: "WINDOWS UTF-8 IO: UTF-8로 읽고 mojibake면 Python으로 재시도하세요. 일반·명시적 법제처·질문-only·추상 fixture를 구분하세요. 쟁점이 특정되면 법령명·날짜·조문·경과조치가 없어도 기본 4단 법률검토형을 사용하세요. 건축허가→법 개정→변경허가의 강화기준 적용 문제는 날짜·법령명 미확인이어도 질문-only로 전환하지 말고 첫 줄 `# 1. 질의요지`부터 네 H1을 출력하세요. 최초 허가와 변경허가를 분리하고 시행일·경과조치는 확인 필요로 둔 조건부 결론을 쓰세요. 법제처 해석례와 대법원 판결 비교 시 행정부 해석과 사법판단의 기능·구속력 차이를 밝히고 구법·개정법 문언을 구분하세요. 제공되지 않은 사실·정의·URL은 만들지 마세요. 법제처 1~3은 명시 요청 때만 사용하세요."
# Contract markers: 법제처 질의로서 부적합할 수 있음을 먼저 한 문장으로 설명
# 모든 `%`는 뒤에 16진수 두 자리; 값이 빈 query parameter URL은 사용하지 않음
# 자족적 법적 논증의 타당성을 묻는 경우와 미확인 상태 자체를 제공된 전제로 보세요
# 과거 허가와 후속 변경허가; 법령명이 특정되지 않았더라도 질문-only로 전환하지 마세요
policy:
  allow_implicit_invocation: false

# Stable source-link gate: reject law.go.kr/LSW/flDownload.do + flNm, including valid percent-encoded filenames.
