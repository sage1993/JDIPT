name: JDIPT CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pytest pyyaml

      - name: Run Python tests
        run: python -m pytest -q

      - name: Validate repository contracts
        run: python scripts/validate_repo.py

      - name: Validate authority and temporal contracts
        run: python scripts/validate_authority_temporal_contract.py

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Install Node dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Smoke-test MCP command
        run: npm run mcp -- --help
